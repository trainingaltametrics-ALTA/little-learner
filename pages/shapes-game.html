<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shapes Game - Little Learner</title>

    <link rel="stylesheet" href="../css/shapes-game.css">
</head>

<body>

    <!-- HEADER -->
    <header class="game-header">

        <a href="../index.html" class="home-button">
            🏠 Home
        </a>

        <div class="game-title">
            🎮 Shapes Game
        </div>

        <div class="star-counter">
            ⭐ <span id="starCount">0</span>
        </div>

    </header>


    <!-- MAIN -->
    <main class="game-container">

        <!-- START SCREEN -->
        <section id="startScreen" class="screen">

            <div class="game-icon">
                🔷
            </div>

            <h1>Shapes Game!</h1>

            <p>
                Let's see how well you know your shapes! 🎉
            </p>

            <div class="game-info">

                <div>
                    🔷
                    <strong>10</strong>
                    Questions
                </div>

                <div>
                    ⭐
                    Earn Stars
                </div>

                <div>
                    🧠
                    Learn & Play
                </div>

            </div>

            <button
                class="start-button"
                onclick="startGame()">

                🚀 Start Game

            </button>

        </section>


        <!-- GAME SCREEN -->
        <section
            id="gameScreen"
            class="screen hidden">

            <!-- TOP INFO -->
            <div class="game-progress">

                <span>
                    Question
                    <strong id="questionNumber">1</strong>
                    / 10
                </span>

                <span>
                    Score:
                    <strong id="score">0</strong>
                </span>

            </div>


            <!-- PROGRESS BAR -->
            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill">
                </div>

            </div>


            <!-- QUESTION -->
            <div class="question-card">

                <h2 id="questionText">
                    Which shape is this?
                </h2>


                <!-- VISUAL -->
                <div
                    id="questionVisual"
                    class="question-visual">
                </div>


                <!-- LISTEN -->
                <button
                    class="listen-button"
                    onclick="listenQuestion()">

                    🔊 Listen

                </button>


                <!-- OPTIONS -->
                <div
                    id="optionsContainer"
                    class="options-container">
                </div>


                <!-- FEEDBACK -->
                <div
                    id="feedback"
                    class="feedback">
                </div>

            </div>

        </section>


        <!-- RESULT SCREEN -->
        <section
            id="resultScreen"
            class="screen hidden">

            <div class="result-icon">
                🏆
            </div>

            <h1>Game Complete!</h1>

            <p id="resultMessage">
                Great job!
            </p>

            <div class="result-score">

                <div class="final-score">
                    <span id="finalScore">0</span>
                    / 10
                </div>

                <div class="earned-stars">
                    ⭐
                    <span id="earnedStars">0</span>
                    Stars Earned
                </div>

            </div>


            <div class="result-buttons">

                <button
                    class="play-again-button"
                    onclick="startGame()">

                    🔄 Play Again

                </button>

                <a
                    href="shapes.html"
                    class="learn-button">

                    🔷 Learn Shapes

                </a>

                <a
                    href="../index.html"
                    class="home-result-button">

                    🏠 Back Home

                </a>

            </div>

        </section>

    </main>


    <script src="../js/shapes-game.js"></script>

</body>
</html>
