<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Numbers Game - Little Learner</title>

    <link
        rel="stylesheet"
        href="../css/numbers-game.css"
    >
</head>

<body>

    <!-- Header -->
    <header class="top-header">

        <button
            class="home-button"
            onclick="goHome()"
        >
            🏠 Home
        </button>

        <h1>🎮 Numbers Game</h1>

        <div class="stars">
            ⭐ <span id="starCount">0</span>
        </div>

    </header>


    <main class="game-container">

        <!-- Start Screen -->
        <section
            id="startScreen"
            class="screen"
        >

            <div class="start-icon">
                🔢
            </div>

            <h2>🎮 Number Challenge!</h2>

            <p>
                Let's see how well you can count!
            </p>

            <div class="game-info">

                <div>
                    🔢
                    <strong>10</strong>
                    <span>Questions</span>
                </div>

                <div>
                    ⭐
                    <strong>Stars</strong>
                    <span>Rewards</span>
                </div>

                <div>
                    🎉
                    <strong>Fun</strong>
                    <span>Learning</span>
                </div>

            </div>

            <button
                class="start-button"
                onclick="startGame()"
            >
                🚀 Start Game
            </button>

        </section>


        <!-- Game Screen -->
        <section
            id="gameScreen"
            class="screen hidden"
        >

            <!-- Question Progress -->
            <div class="question-progress">

                <div class="progress-info">
                    <span id="questionNumber">
                        Question 1 of 10
                    </span>

                    <span id="scoreText">
                        Score: 0
                    </span>
                </div>

                <div class="progress-bar">
                    <div
                        id="questionFill"
                        class="progress-fill"
                    ></div>
                </div>

            </div>


            <!-- Question Card -->
            <div class="question-card">

                <div
                    id="questionText"
                    class="question-text"
                >
                    How many apples?
                </div>

                <div
                    id="questionObjects"
                    class="question-objects"
                >
                    🍎🍎🍎
                </div>

                <button
                    class="listen-button"
                    onclick="listenQuestion()"
                >
                    🔊 Listen
                </button>

            </div>


            <!-- Options -->
            <div
                id="options"
                class="options"
            ></div>


            <!-- Feedback -->
            <div
                id="feedback"
                class="feedback"
            ></div>

        </section>


        <!-- Result Screen -->
        <section
            id="resultScreen"
            class="screen hidden"
        >

            <div class="trophy">
                🏆
            </div>

            <h2>Game Complete!</h2>

            <div
                id="finalScore"
                class="final-score"
            >
                0 / 10
            </div>

            <p id="resultMessage">
                Great job!
            </p>

            <div class="result-buttons">

                <button
                    class="play-again"
                    onclick="startGame()"
                >
                    🔄 Play Again
                </button>

                <button
                    class="home-result"
                    onclick="goHome()"
                >
                    🏠 Back Home
                </button>

            </div>

        </section>

    </main>


    <footer>
        🌟 Keep Counting, Little Star! 🌟
    </footer>


    <script src="../js/numbers-game.js"></script>

</body>
</html>
