<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Animals Game - Little Learner</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/animals-game.css">
</head>

<body>

  <header class="game-header">

    <a href="../index.html" class="back-button">
      🏠 Home
    </a>

    <div class="game-title">
      🐾 Animal Game
    </div>

    <div class="stars">
      ⭐ <span id="starCount">0</span>
    </div>

  </header>


  <main class="game-container">

    <!-- START -->
    <section id="startScreen" class="game-screen">

      <div class="game-hero">
        🐶 🐱 🦁
      </div>

      <h1>🐾 Animal Adventure!</h1>

      <p>Let's learn about animals!</p>

      <p class="game-instruction">
        Look at the animal and choose the correct answer.
      </p>

      <button id="startButton" class="start-button">
        🎮 Start Game
      </button>

    </section>


    <!-- GAME -->
    <section id="gameScreen" class="game-screen hidden">

      <div class="question-top">

        <span>
          Question
          <strong id="questionNumber">1</strong>
          of 10
        </span>

        <span>
          ⭐
          <strong id="score">0</strong>
        </span>

      </div>


      <div class="progress-bar">
        <div id="gameProgress"></div>
      </div>


      <div class="question-card">

        <div id="animalPicture" class="game-animal">
          🐶
        </div>

        <h2 id="questionText">
          Which animal is this?
        </h2>

        <button id="listenButton" class="listen-button">
          🔊 Listen
        </button>

      </div>


      <div id="options" class="options-container"></div>


      <div id="feedback" class="feedback"></div>

    </section>


    <!-- RESULT -->
    <section id="resultScreen" class="game-screen hidden">

      <div class="result-emoji">
        🏆
      </div>

      <h1>🎉 Game Complete!</h1>

      <p id="resultMessage"></p>

      <div class="final-score">
        Score:
        <strong id="finalScore">0</strong>
        / 10
      </div>

      <div class="earned-stars">
        ⭐ Stars Earned:
        <strong id="earnedStars">0</strong>
      </div>

      <button id="playAgainButton" class="play-again-button">
        🔄 Play Again
      </button>

      <a href="animals.html" class="learn-button">
        🐾 Learn Animals
      </a>

      <a href="../index.html" class="home-button">
        🏠 Back Home
      </a>

    </section>

  </main>


  <script src="../js/animals-game.js"></script>

</body>
</html>
