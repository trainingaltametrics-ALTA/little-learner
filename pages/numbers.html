<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Learn Numbers - Little Learner</title>

    <link
        rel="stylesheet"
        href="../css/numbers.css"
    >
</head>

<body>

    <!-- Header -->
    <header class="top-header">

        <button
            class="home-button"
            onclick="goHome()"
        >
            🏠 Home
        </button>

        <h1>🔢 Learn Numbers</h1>

        <div class="stars">
            ⭐ <span id="starCount">0</span>
        </div>

    </header>


    <!-- Main Content -->
    <main class="numbers-container">

        <!-- Progress -->
        <section class="progress-section">

            <div class="progress-title">
                <span>Number Progress</span>
                <span id="progressText">1 / 20</span>
            </div>

            <div class="progress-bar">
                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>
            </div>

        </section>


        <!-- Learning Card -->
        <section class="number-card">

            <div
                id="number"
                class="big-number"
            >
                1
            </div>

            <div
                id="objects"
                class="objects"
            >
                🍎
            </div>

            <h2 id="numberWord">
                One
            </h2>

            <p id="numberSentence">
                One apple.
            </p>

            <button
                class="listen-button"
                onclick="speakCurrentNumber()"
            >
                🔊 Listen
            </button>

            <div
                id="completedMessage"
                class="completed-message"
            >
                ⭐ Number Completed!
            </div>

        </section>


        <!-- Navigation -->
        <div class="navigation">

            <button
                id="previousButton"
                onclick="previousNumber()"
            >
                ⬅️ Previous
            </button>

            <button
                id="nextButton"
                onclick="nextNumber()"
            >
                Next ➡️
            </button>

        </div>


        <!-- Number Selector -->
        <section class="number-selector-section">

            <h3>Choose a Number</h3>

            <div
                id="numberButtons"
                class="number-buttons"
            ></div>

        </section>


        <!-- Game -->
        <a
            href="numbers-game.html"
            class="game-button"
        >
            🎮 Play Numbers Game
        </a>

    </main>


    <!-- Footer -->
    <footer>
        🌟 Keep Learning, Little Star! 🌟
    </footer>


    <script src="../js/numbers.js"></script>

</body>
</html>
